<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QMS Dashboard - Money TDD</title>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Mermaid.js for Diagrams -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent: #38bdf8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --success: #22c55e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        aside {
            width: 280px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .logo {
            font-weight: 600;
            font-size: 1.25rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        nav ul {
            list-style: none;
        }

        nav li {
            margin-bottom: 0.5rem;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            display: block;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            transition: all 0.2s;
        }

        nav a:hover,
        nav a.active {
            color: var(--text-primary);
            background-color: var(--border);
        }

        nav a.active {
            border-left: 3px solid var(--accent);
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 3rem;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .content-card {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--bg-secondary);
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
        }

        /* Markdown Styles */
        #markdown-content h1 {
            font-size: 2.25rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
        }

        #markdown-content h2 {
            font-size: 1.5rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: var(--accent);
        }

        #markdown-content h3 {
            font-size: 1.25rem;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }

        #markdown-content p {
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }

        #markdown-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            font-size: 0.9rem;
        }

        #markdown-content th,
        #markdown-content td {
            padding: 0.75rem;
            border: 1px solid var(--border);
            text-align: left;
        }

        #markdown-content th {
            background-color: var(--bg-primary);
            color: var(--accent);
        }

        #markdown-content code {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-primary);
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            font-size: 0.85rem;
        }

        #markdown-content pre {
            background: var(--bg-primary);
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }

        /* Mermaid Container */
        .mermaid {
            background: rgba(255, 255, 255, 0.03);
            padding: 1rem;
            border-radius: 0.5rem;
            margin: 1.5rem 0;
            display: flex;
            justify-content: center;
        }

        /* Loader */
        #loader {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: var(--accent);
        }

        /* Status Badge */
        .status-green {
            color: var(--success);
            font-weight: bold;
        }
    </style>
</head>

<body>
    <aside>
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            QMS Dashboard
        </div>
        <nav>
            <ul>
                <li><a href="#" onclick="loadDoc('docs/user-flow/money-calculation.md', this)" class="active">User Flow
                        & Spec</a></li>
                <li><a href="#" onclick="loadDoc('docs/RTM.md', this)">RTM Matrix</a></li>
            </ul>
        </nav>
        <div style="margin-top: auto; font-size: 0.8rem; color: var(--text-secondary);">
            TDD Practice v2026.02.09
        </div>
    </aside>

    <main>
        <div id="loader">Loading Documentation...</div>
        <div class="content-card">
            <div id="markdown-content"></div>
        </div>
    </main>

    <script>
        async function loadDoc(path, element) {
            const contentDiv = document.getElementById('markdown-content');
            const loader = document.getElementById('loader');

            // UI Update
            if (element) {
                document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
                element.classList.add('active');
            }

            loader.style.display = 'block';
            contentDiv.style.opacity = '0.3';

            if (window.location.protocol === 'file:') {
                contentDiv.innerHTML = `<h1 style="color: #f59e0b">Local File Detected</h1>
                <p>브라우저의 보안 정책상 파일을 직접 열면(file://) 내용을 불러올 수 없습니다.</p>
                <p><strong>해결 방법:</strong> 터미널에서 <code>./launch-qms.sh</code>를 실행하거나 <code>npx serve .</code>을 사용해 주세요.</p>`;
                loader.style.display = 'none';
                contentDiv.style.opacity = '1';
                return;
            }

            try {
                // Ensure path is relative to the root for the fetch
                const fetchPath = path.startsWith('/') ? path.substring(1) : path;
                const response = await fetch('./' + fetchPath + '?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Failed to load ' + path + ' (Status: ' + response.status + ')');
                const text = await response.text();

                // Parse Markdown
                contentDiv.innerHTML = marked.parse(text);

                // Handle Mermaid blocks after marked has parsed them
                const codeBlocks = contentDiv.querySelectorAll('pre code.language-mermaid');
                codeBlocks.forEach(block => {
                    const pre = block.parentElement;
                    const mermaidDiv = document.createElement('div');
                    mermaidDiv.className = 'mermaid';
                    mermaidDiv.textContent = block.textContent;
                    pre.replaceWith(mermaidDiv);
                });

                // Re-initialize Mermaid
                if (window.mermaid) {
                    await mermaid.run();
                }

                // Small delay for smooth transition
                setTimeout(() => {
                    loader.style.display = 'none';
                    contentDiv.style.opacity = '1';
                }, 300);

            } catch (err) {
                contentDiv.innerHTML = `<h1 style="color: #ef4444">Error</h1><p>${err.message}</p><p>Please make sure you are running this through a local server (e.g., <code>npx serve .</code>).</p>`;
                loader.style.display = 'none';
                contentDiv.style.opacity = '1';
            }
        }

        // Initial Load
        window.addEventListener('DOMContentLoaded', () => {
            loadDoc('docs/user-flow/money-calculation.md');
        });
    </script>
</body>

</html>
